<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050305">
<title>Flower</title>
<footer class="page-footer">
      <a href="./gallery.html" class="back-link">

        Back to gallery

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--fg:#f4efe6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--fg);-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;background:#000}
  #hd{position:fixed;right:5vw;top:4vh;display:none;flex-direction:column;align-items:center;gap:8px;
      font:500 clamp(11px,2.6vw,16px) 'Oswald',sans-serif;text-transform:uppercase;color:#fff;opacity:0;pointer-events:none}
  #hd svg{width:clamp(36px,8vw,64px);height:auto}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font:12px system-ui,sans-serif;color:#777;opacity:.0;transition:opacity .4s}
  .nav{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;display:none;align-items:center;gap:10px;
       padding:11px 20px;border-radius:999px;border:1px solid rgba(255,170,205,.45);
       background:rgba(20,6,14,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
       color:#ffd9e8;text-decoration:none;text-shadow:0 0 10px rgba(255,140,190,.55);
       box-shadow:0 0 18px rgba(255,120,180,.22),inset 0 0 12px rgba(255,150,200,.08);
       font:500 clamp(12px,3vw,14px) 'Oswald',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;
       transition:box-shadow .25s,border-color .25s,background .25s,transform .2s}
  .nav:hover,.nav:focus-visible{border-color:rgba(255,200,225,.9);background:rgba(60,14,38,.6);
       box-shadow:0 0 28px rgba(255,120,180,.45),inset 0 0 14px rgba(255,150,200,.15);outline:none}
  .nav:active{transform:scale(.96)}
  #prev{left:max(16px,env(safe-area-inset-left))}
  #next{right:max(16px,env(safe-area-inset-right))}
</style>
</head>
<body>
<canvas id="c"></canvas>

<a class="nav" id="prev" href="#" aria-label="Previous page">&#9825; &#8592; Prev</a>
<a class="nav" id="next" href="#" aria-label="Next page">Next &#8594; &#9825;</a>

<div id="hd">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
    <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fd5"/><stop offset=".35" stop-color="#ff543e"/><stop offset=".7" stop-color="#c837ab"/><stop offset="1" stop-color="#7a3cf0"/></linearGradient></defs>
    <g id="igs" stroke="url(#g)"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="#fff" stroke="none"/></g>
  </svg>
  <span id="hdt"></span>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const HANDLE = '';        // e.g. '@yourname'  ('' = no handle / end card)
const PREV_URL = 'gallery.html';   // page to open with the Prev button ('' = hide it)
const NEXT_URL = 'next.html';   // page to open with the Next button ('' = hide it)
const LOOP   = true;      // restart from the eye after the bouquet
let   FPS    = 60;        // target rate; auto-drops to 30 if the device can't keep up

/* ---- timeline (seconds) ---- */
const T_EYE_ZOOMOUT_START = 1.5;   // iris close-up -> full eye
const T_EYE_HOLD          = 4.0;   // eye looks around & blinks
const T_ZOOM_IN           = 9.8;   // zoom INTO the pupil
const T_LILY              = 10.9;  // bouquet starts growing INSIDE the pupil while it is still zooming
const T_ZOOM_END          = 15.0;  // pupil fills the whole screen
const LILY_GROW           = 10.5;
const T_FADE_OUT          = 28.5;
const T_TOTAL             = 31.0;

/* ---- ascii ---- */
const RAMP = " .'`,:;-~+/|trxjfCLU0O#@";
const RAMP_L = " .,-~:=+*xX%#@";   // horizontal-biased glyphs for the bouquet
const CH_RATIO = 1.4;     // character cell height / width

/* =====================================================================
   helpers
   ===================================================================== */
const TAU=Math.PI*2, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function rng(seed){return()=>((seed=Math.imul(seed^seed>>>15,seed|1),seed^=seed+Math.imul(seed^seed>>>7,seed|61),((seed^seed>>>14)>>>0)/4294967296))}

/* =====================================================================
   canvases / layout  (fully responsive)
   ===================================================================== */
const out=document.getElementById('c'), octx=out.getContext('2d');
const SRC=document.createElement('canvas'), sctx=SRC.getContext('2d',{willReadFrequently:true});
const hd=document.getElementById('hd');
let cols,rows,cellW,cellH,Vw,Vh,U,dpr,vw,vh,lilyF,lilyY;

function layout(){
  vw=innerWidth; vh=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
  const target=clamp(vw/125,3.2,4.2);                 // px per character column
  cols=Math.round(vw/target); cellW=vw/cols;
  cellH=cellW*CH_RATIO; rows=Math.ceil(vh/cellH);
  SRC.width=cols; SRC.height=rows;
  Vw=cols; Vh=rows*CH_RATIO;                      // virtual square-pixel space
  U=Math.min(Vw,Vh*1.1);                          // eye scale unit
  lilyF=Math.min(Vw*.92/100,Vh*.7/142);          // bouquet scale
  lilyY=Vh*.9-142*lilyF;                          // bouquet base alignment
  out.width=Math.round(vw*dpr); out.height=Math.round(rows*cellH*dpr);
  out.style.height=(rows*cellH)+'px';
  hd.style.display=HANDLE?'flex':'none';
  document.getElementById('hdt').textContent=HANDLE;
}
addEventListener('resize',layout);
addEventListener('orientationchange',()=>setTimeout(layout,200));

/* =====================================================================
   SCENE A — EYE
   ===================================================================== */
let lastZoom=1, clipR2=Infinity;
function drawEye(c,t){
  // state
  let zoom=1, open=1, look=0;
  if(t<T_EYE_ZOOMOUT_START){ zoom=3.4 }
  else if(t<T_EYE_HOLD){ zoom=lerp(3.4,1,easeIO((t-T_EYE_ZOOMOUT_START)/(T_EYE_HOLD-T_EYE_ZOOMOUT_START))) }
  else if(t<T_ZOOM_IN){
    look=Math.sin(t*1.3)*.05*(1-ease(clamp((t-(T_ZOOM_IN-1.2))/1.2)));
    const bt=(t-T_EYE_HOLD)%3.0; if(bt>2.7) open=1-Math.sin((bt-2.7)/.3*Math.PI)*.8;
  } else {
    const k=clamp((t-T_ZOOM_IN)/(T_ZOOM_END-T_ZOOM_IN));
    zoom=Math.exp(lerp(0,Math.log(55),easeIO(k)));   // exponential = smooth, constant-feeling dive
    look=0; lastZoom=zoom;
  }
  const cx=Vw/2, cy=Vh/2;
  c.fillStyle='#050302'; c.fillRect(0,0,Vw,Vh);
  c.save(); c.translate(cx,cy); c.scale(zoom,zoom); c.translate(-cx,-cy);

  // skin
  const sg=c.createRadialGradient(cx,cy,U*.05,cx,cy,U*.75);
  sg.addColorStop(0,'#8a5c3c'); sg.addColorStop(.6,'#5a3a24'); sg.addColorStop(1,'#120a06');
  c.fillStyle=sg; c.fillRect(cx-Vw*2,cy-Vh*2,Vw*4,Vh*4);

  // eye geometry
  const ew=U*.46, eh=ew*.5*open, ex=cx, ey=cy;
  const lidTop=()=>{c.moveTo(ex-ew,ey);c.bezierCurveTo(ex-ew*.5,ey-eh*1.3,ex+ew*.5,ey-eh*1.3,ex+ew,ey)};
  c.save(); c.beginPath(); lidTop();
  c.bezierCurveTo(ex+ew*.5,ey+eh*.9,ex-ew*.5,ey+eh*.9,ex-ew,ey); c.closePath(); c.clip();
  c.fillStyle='#ebe6de'; c.fillRect(ex-ew,ey-ew,ew*2,ew*2);
  const sh=c.createRadialGradient(ex,ey,ew*.2,ex,ey,ew*1.1);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(60,30,20,.55)');
  c.fillStyle=sh; c.fillRect(ex-ew,ey-ew,ew*2,ew*2);
  // iris
  const ix=ex+look*ew*2, iy=ey, ir=ew*.37;
  const ig=c.createRadialGradient(ix,iy,ir*.2,ix,iy,ir);
  ig.addColorStop(0,'#7a4a1c'); ig.addColorStop(.6,'#b27a3a'); ig.addColorStop(.9,'#4a2c12'); ig.addColorStop(1,'#1c0f06');
  c.fillStyle=ig; c.beginPath(); c.arc(ix,iy,ir,0,TAU); c.fill();
  c.strokeStyle='rgba(255,210,140,.35)'; c.lineWidth=ew*.012;
  for(let i=0;i<80;i++){const a=i/80*TAU;c.beginPath();c.moveTo(ix+Math.cos(a)*ir*.38,iy+Math.sin(a)*ir*.38);c.lineTo(ix+Math.cos(a)*ir*.95,iy+Math.sin(a)*ir*.95);c.stroke()}
  // pupil
  c.fillStyle='#000'; c.beginPath(); c.arc(ix,iy,ir*.36,0,TAU); c.fill();
  // highlight
  c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.arc(ix-ir*.4,iy-ir*.42,ir*.1,0,TAU); c.fill();
  c.restore();
  // lash line
  c.strokeStyle='rgba(15,8,4,.9)'; c.lineWidth=ew*.035; c.beginPath(); lidTop(); c.stroke();
  c.restore();

  // fade in from black at the very start
  if(t<.8){c.fillStyle=`rgba(0,0,0,${1-ease(t/.8)})`;c.fillRect(0,0,Vw,Vh)}
}

/* =====================================================================
   SCENE B — LILY BOUQUET  (vector lilies, layout traced from reference)
   virtual box: 100 x 142
   ===================================================================== */
const BASE=[46,141];
const PAL={
  red:   ['#6e0910','#d71f27','#ff5a45'],
  cream: ['#9c5a26','#e6d8c4','#fff8ee'],
  peach: ['#a8582a','#d99f78','#f6e0cc'],
  yellow:['#9a6208','#e6b61e','#ffe760'],
  pink:  ['#5e1862','#d046b6','#ffb0ee'],
  wine:  ['#3e0818','#a02c58','#e07ca2'],
  dark:  ['#34050a','#86101a','#c93a40'],
};
// x,y,radius,palette,rotation,tilt,delay(0-1), order = drawing order (back -> front)
const FL=[
  {x:26,y:23,r:19,p:'cream', rot:.4, tilt:.8, d:.10},
  {x:51,y:9.5,r:15,p:'peach',rot:1.1,tilt:.7, d:.22},
  {x:76,y:22,r:17,p:'yellow',rot:.2,tilt:.8, d:.18},
  {x:86,y:50,r:19,p:'wine',  rot:.9,tilt:.85,d:.30},
  {x:13.5,y:51,r:16,p:'yellow',rot:.7,tilt:.85,d:.26},
  {x:84,y:104,r:16,p:'dark', rot:.3,tilt:.8, d:.36},
  {x:13.5,y:100,r:15,p:'yellow',rot:1.0,tilt:.8,d:.34},
  {x:50,y:36,r:30,p:'red',   rot:.15,tilt:.9, d:.00},
  {x:35,y:71.5,r:26,p:'pink',rot:.5,tilt:.9, d:.08},
  {x:73,y:74,r:26,p:'cream', rot:.05,tilt:.85,d:.14},
  {x:49,y:101,r:24,p:'peach',rot:.8,tilt:.85,d:.20},
];
const BUDS=[{x:40,y:4,c:'#6a8a3c'},{x:65,y:1.5,c:'#7a2a3a'}];
const rr0=rng(5);
FL.forEach((f,i)=>{f.j=Array.from({length:6},()=>(rr0()-.5)*.22);f.bend=(rr0()-.5)*10;f.sp=Array.from({length:26},()=>[rr0(),rr0(),rr0()])});
// leaves: [angle(rad, 0=right, -PI/2=up), length, width]
const LEAVES=[];
(function(){const r=rng(21);
  for(let i=0;i<22;i++){const a=-Math.PI+.15+(i/21)*(Math.PI-.3);
    LEAVES.push({ox:BASE[0]+(r()-.5)*14,oy:BASE[1]-r()*8,a:a+(r()-.5)*.25,l:20+r()*28,w:3.6+r()*3,front:i%4===0,dl:r()*.25});}
})();

function petalPath(c,len,w,curl,wave){
  c.beginPath();c.moveTo(0,0);
  c.bezierCurveTo(len*.2,-w*1.1,len*.5,-w*(1.06+wave),len*.8,-w*.5);
  c.quadraticCurveTo(len*.94,-w*.16,len,curl);
  c.quadraticCurveTo(len*.94,w*.2,len*.8,w*.5);
  c.bezierCurveTo(len*.5,w*(1.06-wave),len*.2,w*1.1,0,0);c.closePath();
}
function drawPetal(c,ang,len,w,pal,curl,wave,seed){
  c.save();c.rotate(ang);
  // body: colour runs throat -> mid -> tip
  const g=c.createLinearGradient(0,0,len,0);
  g.addColorStop(0,pal[0]);g.addColorStop(.22,pal[0]);g.addColorStop(.5,pal[1]);g.addColorStop(1,pal[2]);
  petalPath(c,len,w,curl,wave);c.fillStyle=g;c.fill();
  c.save();petalPath(c,len,w,curl,wave);c.clip();
  // form shading across the width (light top edge -> shadow bottom edge)
  const h=c.createLinearGradient(0,-w,0,w);
  h.addColorStop(0,'rgba(255,255,255,.30)');h.addColorStop(.35,'rgba(255,255,255,.04)');h.addColorStop(.55,'rgba(0,0,0,.10)');h.addColorStop(1,'rgba(0,0,0,.38)');
  c.fillStyle=h;c.fillRect(0,-w*1.3,len,w*2.6);
  // soft centre stripe (the folded midrib catches light)
  const m=c.createLinearGradient(0,-w*.3,0,w*.3);
  m.addColorStop(0,'rgba(255,255,255,0)');m.addColorStop(.5,'rgba(255,255,255,.22)');m.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=m;c.fillRect(len*.05,-w*.3,len*.85,w*.6);
  // veins
  c.strokeStyle='rgba(0,0,0,.14)';c.lineWidth=.35;
  for(let k=-2;k<=2;k++){if(!k)continue;c.beginPath();c.moveTo(len*.08,k*w*.05);c.quadraticCurveTo(len*.5,k*w*.42,len*.9,k*w*.12+curl*.6);c.stroke()}
  // raised dots (papillae) along the throat
  c.fillStyle=pal[0];c.globalAlpha=.75;
  for(let k=0;k<9;k++){const u=.1+k*.045+((seed*7+k*13)%5)*.006,v=(((seed*3+k*17)%7)-3)*w*.07;
    c.beginPath();c.arc(len*u,v,.55+((k+seed)%3)*.12,0,TAU);c.fill()}
  c.globalAlpha=1;
  c.restore();
  // dark edge + light rim on the upper edge
  petalPath(c,len,w,curl,wave);c.strokeStyle='rgba(0,0,0,.7)';c.lineWidth=.8;c.stroke();
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=.35;c.beginPath();
  c.moveTo(len*.1,-w*.55);c.bezierCurveTo(len*.3,-w*1.0,len*.55,-w*.98,len*.78,-w*.46);c.stroke();
  // midrib
  c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=.45;c.beginPath();c.moveTo(len*.06,0);c.lineTo(len*.9,curl*.8);c.stroke();
  c.restore();
}
function drawFlower(c,f,bloom,t){
  const pal=PAL[f.p],R=f.r*1.2;
  c.save();c.translate(f.x+Math.sin(t*.6+f.x)*.25,f.y);c.rotate(f.rot+Math.sin(t*.4+f.y)*.02);c.scale(1,f.tilt);
  // soft contact shadow so overlapping flowers read as layers
  const sh=c.createRadialGradient(0,0,R*.2,0,0,R*1.05);sh.addColorStop(0,'rgba(0,0,0,.0)');sh.addColorStop(1,'rgba(0,0,0,.35)');
  c.fillStyle=sh;c.beginPath();c.arc(0,0,R*1.05*ease(clamp(bloom*1.5)),0,TAU);c.fill();
  // petals unfurl one after another: outer ring first, inner ring second
  for(let pass=0;pass<2;pass++)for(let i=pass;i<6;i+=2){
    const po=ease(clamp((bloom-(pass?.14:0)-(i>>1)*.05)/.62));
    const len=R*(pass?.9:1)*(.34+.66*po), w=R*(pass?.27:.31)*(.38+.62*po);
    const curl=(pass?-1:1)*R*.07*po, wave=(f.j[i]*.6);
    drawPetal(c,i*Math.PI/3+f.j[i]*(.4+.6*po),len,w,pal,curl,wave,i+Math.floor(f.x));
  }
  const open=ease(clamp(bloom));
  // green-gold throat
  const tg=c.createRadialGradient(0,0,0,0,0,R*.2);
  tg.addColorStop(0,'rgba(190,200,90,.85)');tg.addColorStop(.5,pal[0]);tg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=tg;c.beginPath();c.arc(0,0,R*.2*open,0,TAU);c.fill();
  // speckles clustered toward the centre
  c.fillStyle='rgba(55,6,10,.8)';
  f.sp.forEach(s=>{const k=Math.floor(s[0]*6),a=k*Math.PI/3+f.j[k]+(s[1]-.5)*.4,d=R*(.16+s[2]*.36)*open;
    c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,.45+s[1]*.4,0,TAU);c.fill()});
  // stamens: pale filaments, plump rust anthers with a highlight
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+.5+f.j[i],L=R*(.36+(i%3)*.09)*open,x=Math.cos(a)*L,y=Math.sin(a)*L;
    c.strokeStyle='rgba(240,232,190,.95)';c.lineWidth=.5;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(x*.5,y*.5-1.2,x,y);c.stroke();
    c.save();c.translate(x,y);c.rotate(a+.3);
    c.fillStyle='#a8420c';c.beginPath();c.ellipse(0,0,R*.1,R*.035,0,0,TAU);c.fill();
    c.fillStyle='rgba(255,170,80,.7)';c.beginPath();c.ellipse(-R*.02,-R*.01,R*.05,R*.012,0,0,TAU);c.fill();c.restore();
  }
  // pistil
  const pa=-.9+f.j[0],pl=R*.55*open;
  c.strokeStyle='rgba(230,240,190,.9)';c.lineWidth=.55;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(Math.cos(pa)*pl*.5,Math.sin(pa)*pl*.5-1,Math.cos(pa)*pl,Math.sin(pa)*pl);c.stroke();
  c.fillStyle='#c9d66a';c.beginPath();c.arc(Math.cos(pa)*pl,Math.sin(pa)*pl,.9*open,0,TAU);c.fill();
  c.restore();
}
function leaf(c,L,g,t){
  if(g<=0)return;const len=L.l*g;
  c.save();c.translate(L.ox,L.oy);c.rotate(L.a+Math.sin(t*.7+L.ox)*.015);
  const gr=c.createLinearGradient(0,0,len,0);gr.addColorStop(0,'#1f6a2a');gr.addColorStop(.6,'#4fae45');gr.addColorStop(1,'#a6e07a');
  c.fillStyle=gr;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-L.w*g,len,0);c.quadraticCurveTo(len*.5,L.w*g,0,0);c.fill();
  c.strokeStyle='rgba(220,255,200,.45)';c.lineWidth=.45;c.beginPath();c.moveTo(0,0);c.lineTo(len*.95,0);c.stroke();
  c.strokeStyle='rgba(0,40,0,.4)';c.lineWidth=.4;c.beginPath();c.moveTo(0,.5);c.quadraticCurveTo(len*.5,L.w*g*.55,len,0);c.stroke();
  c.restore();
}
const starR=rng(3), stars=Array.from({length:130},()=>[starR(),starR(),.25+starR()*.75]);
function drawLily(c,t){
  const lt=t-T_LILY, p=clamp(lt/LILY_GROW);
  // while the eye is still zooming, the bouquet lives INSIDE the pupil
  const pr=U*.0613*lastZoom, diag=Math.hypot(Vw,Vh)/2;
  c.save();
  if(t<T_ZOOM_END&&pr<diag){c.beginPath();c.arc(Vw/2,Vh/2,pr,0,TAU);c.clip();clipR2=pr*pr}else clipR2=Infinity;
  c.fillStyle='#000';c.fillRect(0,0,Vw,Vh);
  const sa=ease(clamp(lt/2));
  stars.forEach(s=>{c.fillStyle=`rgba(255,255,255,${sa*s[2]*.7})`;c.fillRect(s[0]*Vw,s[1]*Vh,1,1)});
  c.save();c.translate(Vw/2-50*lilyF,lilyY);c.scale(lilyF,lilyF);
  // 1) stems rise first (thin green blades)
  const q=clamp(p/.34), stemG=1-(1-q)*(1-q);   // ease-out: stems start rising immediately
  FL.forEach(f=>{
    const g=clamp(stemG*1.15-f.d*.3);
    c.strokeStyle='#3a8a3a';c.lineWidth=.9;c.beginPath();
    const mx=(BASE[0]+f.x)/2+f.bend,my=(BASE[1]+f.y)/2;
    for(let k=0;k<=20;k++){const u=k/20*g,v=1-u,x=v*v*BASE[0]+2*v*u*mx+u*u*f.x,y=v*v*BASE[1]+2*v*u*my+u*u*f.y;k?c.lineTo(x,y):c.moveTo(x,y)}
    c.stroke();
  });
  BUDS.forEach((b,i)=>{
    const g=clamp(stemG*1.1);if(g<=0)return;
    const x=lerp(BASE[0],b.x,g),y=lerp(BASE[1],b.y,g);
    c.strokeStyle='#3a8a3a';c.lineWidth=.8;c.beginPath();c.moveTo(BASE[0],BASE[1]);c.lineTo(x,y);c.stroke();
    if(g>.95){c.fillStyle=b.c;c.beginPath();c.ellipse(b.x,b.y,2,3.6,i?.4:-.4,0,TAU);c.fill()}
  });
  // 2) back leaves
  LEAVES.filter(L=>!L.front).forEach(L=>leaf(c,L,ease(clamp((p-.12-L.dl)/.35)),t));
  // 3) buds -> blooms, back to front
  FL.forEach(f=>{
    const tip=clamp(stemG*1.15-f.d*.3);
    if(tip<1&&p<.38)return;
    const b=clamp((p-.42-f.d*.55)/.32);
    if(b<=0){const g=clamp((p-.3)/.12);c.fillStyle=PAL[f.p][1];c.beginPath();c.ellipse(f.x,f.y,2.2*g,4*g,f.rot,0,TAU);c.fill();return}
    drawFlower(c,f,b,t);
  });
  // 4) front leaves
  LEAVES.filter(L=>L.front).forEach(L=>leaf(c,L,ease(clamp((p-.25-L.dl)/.4)),t));
  c.restore();
  c.restore();
}

/* =====================================================================
   ASCII renderer
   ===================================================================== */
function render(t){
  sctx.setTransform(1,0,0,1/CH_RATIO,0,0);       // virtual square px -> char grid
  clipR2=Infinity;
  if(t<T_ZOOM_END) drawEye(sctx,t); else {sctx.fillStyle='#000';sctx.fillRect(0,0,Vw,Vh)}
  if(t>=T_LILY) drawLily(sctx,t);
  // seamless black bridge exactly at the hand-off + fade-out at the end
  let veil=0;
  if(t>T_FADE_OUT) veil=ease(clamp((t-T_FADE_OUT)/(T_TOTAL-T_FADE_OUT)));
  if(veil>0){sctx.fillStyle=`rgba(0,0,0,${veil})`;sctx.fillRect(0,0,Vw,Vh)}
  sctx.setTransform(1,0,0,1,0,0);

  const d=sctx.getImageData(0,0,cols,rows).data, nE=RAMP.length-1, nL=RAMP_L.length-1;
  const W=out.width,H=out.height,sx=W/cols,sy=H/rows, lilyOn=t>=T_LILY;
  octx.fillStyle='#000'; octx.fillRect(0,0,W,H);
  octx.font=`${Math.round(sx/.55)}px "Courier New",monospace`; octx.textBaseline='top';
  const hx=Vw/2, hy=Vh/2;
  for(let y=0;y<rows;y++){
    const vy=(y+.5)*CH_RATIO-hy, vy2=vy*vy;
    for(let x=0;x<cols;x++){
      const i=(y*cols+x)*4,r=d[i],g=d[i+1],b=d[i+2];
      let L=(.299*r+.587*g+.114*b)/255; if(L<.045)continue;
      const vx=x+.5-hx, inLily=lilyOn&&(vx*vx+vy2<=clipR2);
      let ch,boost;
      if(inLily){
        if(y%2)L*=.84;                               // scan-line banding like the original
        let k=Math.floor(Math.pow(Math.min(1,L),.55)*nL); if(k<4)k=4;
        ch=RAMP_L[Math.min(nL,k)]; boost=1.35;
      } else {
        if(y%3===0)L*=1.25;
        ch=RAMP[Math.min(nE,Math.floor(Math.pow(Math.min(1,L),.8)*nE))]; boost=1.15;
      }
      if(ch===' ')continue;
      octx.fillStyle=`rgb(${Math.min(255,r*boost)|0},${Math.min(255,g*boost)|0},${Math.min(255,b*boost)|0})`;
      octx.fillText(ch,x*sx,y*sy);
    }
  }
  // DOM overlays
  const lt=t-T_LILY;
  if(HANDLE) hd.style.opacity = clamp((t-(T_FADE_OUT-4))/1)*(1-clamp((t-T_FADE_OUT)/1.5));
}

/* =====================================================================
   loop
   ===================================================================== */

/* ---- Prev / Next buttons (+ keyboard arrows) ---- */
(function(){
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  if(PREV_URL){pv.href=PREV_URL;pv.style.display='inline-flex'}
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'&&PREV_URL) location.href=PREV_URL;
    if(e.key==='ArrowRight'&&NEXT_URL) location.href=NEXT_URL;
  });
})();

layout();
const SKIP=+(new URLSearchParams(location.search).get('t')||0);   // ?t=15 jumps ahead (debug)
let cost=0;
let t0=performance.now()-SKIP*1000, last=0, done=false;
function frame(now){
  requestAnimationFrame(frame);
  if(now-last<1000/FPS-1)return; last=now;
  const _s=performance.now();
  let t=(now-t0)/1000;
  if(t>T_TOTAL){ if(LOOP){t0=now;t=0}else{t=T_TOTAL} }
  render(t);
  cost=cost*.9+(performance.now()-_s)*.1; FPS = cost>13 ? 30 : 60;
}
requestAnimationFrame(frame);
</script>
