
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050305">

  <title>For You ♡</title>

  <link rel="stylesheet" href="./next.css">
  <script src="./next.js" defer></script>

  <link rel="stylesheet" href="./music.css">
  <script src="./music.js" defer></script>

  <link rel="stylesheet" href="./transition.css">
  <script src="./transition.js" defer></script>
</head>

<body>
  <main class="page">

    <header class="page-header">
      <p class="eyebrow">SAMIRAA SEGANIIIII</p>

      <h1>For someone beautiful</h1>

      <p class="subtitle">
        Some things are easier to show than to say.
      </p>
    </header>

    <section
      class="heart-stage"
      aria-label="An animated heart made of glowing particles"
    >
      <canvas id="heartCanvas"></canvas>

      <div class="heart-message">
        <span class="heart-symbol">♡</span>
      </div>
    </section>

    <!-- SMALL ROMANTIC GIF -->
    <div class="little-gif">
      <img
        src="./images/love.gif"
        alt="A little animated love surprise"
      >
    </div>

    <section class="heart-controls">
      <button id="glowButton" class="glow-button" type="button">
        Glow level: soft ✧
      </button>
    </section>

    <footer class="page-footer">
      <a href="./gallery.html" class="back-link">
        <span aria-hidden="true">←</span>
        Back to gallery
      </a>

      <p class="footer-note">🙃♡</p>
    </footer>

  </main>
</body>
</html>
